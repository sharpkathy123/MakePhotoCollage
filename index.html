<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Photo Collage Builder</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #007aff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      text-align: center;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      color: var(--accent-color);
    }

    .control {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="file"], select, input[type="range"], input[type="color"], input[type="number"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fafafa;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .control {
      flex: 1;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 14px;
    }

    .btn:disabled {
      background-color: #c7c7cc;
      cursor: not-allowed;
    }

    /* Color Selection UI */
    .color-target-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .target-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .target-btn.active {
      border-color: var(--accent-color);
      background: #eef6ff;
      color: var(--accent-color);
    }

    .color-preview-pill {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.2);
      display: inline-block;
    }

    .palette-container {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px 0;
      scrollbar-width: thin;
    }

    .palette-swatches {
      display: inline-flex;
      gap: 8px;
    }

    .swatch {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px var(--border-color);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .swatch:hover {
      transform: scale(1.15);
    }

    #preview-area {
      margin-top: 24px;
      text-align: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #e5e5ea;
    }

    /* Interactive Placement Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-canvas-container {
      text-align: center;
      margin: 10px 0;
    }

    .modal-canvas-container canvas {
      max-width: 100%;
      max-height: 350px;
      border: 1px solid var(--border-color);
    }

    .target-select-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #f0f0f0;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .target-select-btn.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Collage Generator</h1>

  <div class="control">
    <label for="imgInput">1. Select Photos</label>
    <input type="file" id="imgInput" accept="image/*" multiple>
  </div>

  <div class="section-title">2. Spacing & Colors</div>
  <div class="row">
    <div class="control">
      <label for="innerSpacing">Inner Spacing (px)</label>
      <input type="number" id="innerSpacing" value="16" min="0">
    </div>
    <div class="control">
      <label for="outerSpacing">Outer Border Spacing (px)</label>
      <input type="number" id="outerSpacing" value="24" min="0">
    </div>
  </div>

  <div class="control">
    <label>Choose Color to Assign</label>
    <div class="color-target-toggle">
      <button class="target-btn active" id="targetInnerBtn" onclick="setActiveColorTarget('inner')">
        <span>1. Inner Color</span>
        <span class="color-preview-pill" id="innerPill" style="background-color: #ffffff;"></span>
      </button>
      <button class="target-btn" id="targetOuterBtn" onclick="setActiveColorTarget('outer')">
        <span>2. Outer Border</span>
        <span class="color-preview-pill" id="outerPill" style="background-color: #1c1c1e;"></span>
      </button>
    </div>

    <input type="color" id="innerColor" value="#ffffff" style="display:none;">
    <input type="color" id="outerColor" value="#1c1c1e" style="display:none;">

    <label>Sampled Image Palette (Click any swatch to apply to active target):</label>
    <div class="palette-container">
      <div class="palette-swatches" id="paletteArea"></div>
    </div>
  </div>

  <div class="section-title">3. Photo Shape & Placement</div>
  <div class="control">
    <label for="sizeMode">Select Shape & Placement Option</label>
    <select id="sizeMode">
      <option value="square">Crop to square (All uniform dimensions)</option>
      <option value="sameHeight">Same height</option>
      <option value="sameWidth">Same width</option>
      <option value="placeSquares">Edit places in squares (Interactive per photo)</option>
      <option value="placeOneSquare">Edit places in one square (Interactive all-in-one)</option>
      <option value="padSquareMax">Pad to square by max edge</option>
    </select>
  </div>

  <div class="section-title">4. Photo Masking</div>
  <div class="control">
    <label for="maskMode">Select Mask Option</label>
    <select id="maskMode">
      <option value="none">None</option>
      <option value="rounded">Rounded Rectangle</option>
      <option value="ellipse">Ellipse</option>
    </select>
  </div>

  <div class="control" id="radiusGroup" style="display: none;">
    <label for="cornerRadius">Corner Radius (px): <span id="radiusVal">30</span></label>
    <input type="range" id="cornerRadius" min="0" max="150" value="30">
  </div>

  <div class="section-title">5. Final Layout & Assembly</div>
  <div class="row">
    <div class="control">
      <label for="layoutType">Arrangement</label>
      <select id="layoutType">
        <option value="grid">Grid</option>
        <option value="horizontal">Horizontal Strip</option>
        <option value="vertical">Vertical Feed</option>
      </select>
    </div>
    <div class="control" id="gridColsGroup">
      <label for="gridCols">Columns (Grid Mode)</label>
      <select id="gridCols">
        <option value="2" selected>2 Columns</option>
        <option value="3">3 Columns</option>
        <option value="4">4 Columns</option>
      </select>
    </div>
  </div>

  <button class="btn" id="generateBtn" disabled>Generate Collage</button>

  <div id="preview-area">
    <canvas id="collageCanvas"></canvas>
  </div>
</div>

<div class="modal" id="editorModal">
  <div class="modal-content">
    <h3 id="modalTitle">Adjust Photo Placement</h3>
    
    <div id="photoSelectorGroup" style="display:none; margin-bottom: 10px;">
      <label>Select Photo to Edit:</label>
      <div id="photoBtnList" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;"></div>
    </div>

    <div class="modal-canvas-container">
      <canvas id="modalCanvas" width="400" height="400"></canvas>
    </div>

    <div class="control">
      <label for="modScale">Scale</label>
      <input type="range" id="modScale" min="0.1" max="3" step="0.05" value="1">
    </div>
    <div class="control">
      <label for="modRotate">Rotation (deg)</label>
      <input type="range" id="modRotate" min="-180" max="180" value="0">
    </div>
    <div class="row">
      <div class="control">
        <label for="modX">Offset X</label>
        <input type="range" id="modX" min="-300" max="300" value="0">
      </div>
      <div class="control">
        <label for="modY">Offset Y</label>
        <input type="range" id="modY" min="-300" max="300" value="0">
      </div>
    </div>

    <button class="btn" id="modalDoneBtn">Done / Next</button>
  </div>
</div>

<script>
  // DOM Elements
  const imgInput = document.getElementById('imgInput');
  const innerSpacing = document.getElementById('innerSpacing');
  const outerSpacing = document.getElementById('outerSpacing');
  const paletteArea = document.getElementById('paletteArea');
  const innerColor = document.getElementById('innerColor');
  const outerColor = document.getElementById('outerColor');
  const innerPill = document.getElementById('innerPill');
  const outerPill = document.getElementById('outerPill');
  const targetInnerBtn = document.getElementById('targetInnerBtn');
  const targetOuterBtn = document.getElementById('targetOuterBtn');
  const sizeMode = document.getElementById('sizeMode');
  const maskMode = document.getElementById('maskMode');
  const cornerRadius = document.getElementById('cornerRadius');
  const radiusGroup = document.getElementById('radiusGroup');
  const radiusVal = document.getElementById('radiusVal');
  const layoutType = document.getElementById('layoutType');
  const gridCols = document.getElementById('gridCols');
  const gridColsGroup = document.getElementById('gridColsGroup');
  const generateBtn = document.getElementById('generateBtn');
  const canvas = document.getElementById('collageCanvas');
  const ctx = canvas.getContext('2d');

  // Modal Elements
  const editorModal = document.getElementById('editorModal');
  const modalTitle = document.getElementById('modalTitle');
  const photoSelectorGroup = document.getElementById('photoSelectorGroup');
  const photoBtnList = document.getElementById('photoBtnList');
  const modalCanvas = document.getElementById('modalCanvas');
  const mCtx = modalCanvas.getContext('2d');
  const modScale = document.getElementById('modScale');
  const modRotate = document.getElementById('modRotate');
  const modX = document.getElementById('modX');
  const modY = document.getElementById('modY');
  const modalDoneBtn = document.getElementById('modalDoneBtn');

  let activeColorTarget = 'inner'; // 'inner' or 'outer'
  let rawImages = [];
  let transforms = [];
  let currentSingleIdx = 0;
  let activeMasterIdx = 0;

  // Toggle Active Color Target
  function setActiveColorTarget(target) {
    activeColorTarget = target;
    if (target === 'inner') {
      targetInnerBtn.classList.add('active');
      targetOuterBtn.classList.remove('active');
    } else {
      targetOuterBtn.classList.add('active');
      targetInnerBtn.classList.remove('active');
    }
  }

  // Sync Color Inputs
  innerColor.addEventListener('input', () => innerPill.style.backgroundColor = innerColor.value);
  outerColor.addEventListener('input', () => outerPill.style.backgroundColor = outerColor.value);

  // UI Event Listeners
  maskMode.addEventListener('change', () => {
    radiusGroup.style.display = (maskMode.value === 'rounded') ? 'flex' : 'none';
  });
  cornerRadius.addEventListener('input', () => {
    radiusVal.textContent = cornerRadius.value;
  });
  layoutType.addEventListener('change', () => {
    gridColsGroup.style.display = (layoutType.value === 'grid') ? 'flex' : 'none';
  });

  // Load Images & Extract Palette
  imgInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    rawImages = [];
    paletteArea.innerHTML = '';

    const loadedImgs = await Promise.all(files.map(file => {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = URL.createObjectURL(file);
      });
    }));

    let maxArea = 0;
    loadedImgs.forEach(img => {
      const area = img.width * img.height;
      if (area > maxArea) maxArea = area;
    });

    const targetAreaPerImg = maxArea / loadedImgs.length;

    rawImages = loadedImgs.map(img => {
      const currentArea = img.width * img.height;
      const scale = Math.min(1, Math.sqrt(targetAreaPerImg / currentArea));
      
      const offCanvas = document.createElement('canvas');
      offCanvas.width = Math.round(img.width * scale);
      offCanvas.height = Math.round(img.height * scale);
      const oCtx = offCanvas.getContext('2d');
      oCtx.drawImage(img, 0, 0, offCanvas.width, offCanvas.height);
      return offCanvas;
    });

    extractHorizontalPalette(rawImages);
    generateBtn.disabled = false;
  });

  function extractHorizontalPalette(canvases) {
    const colorSet = new Set();

    canvases.forEach(c => {
      const cCtx = c.getContext('2d');
      const stepX = Math.floor(c.width / 4);
      const stepY = Math.floor(c.height / 4);

      for (let x = stepX / 2; x < c.width; x += stepX) {
        for (let y = stepY / 2; y < c.height; y += stepY) {
          const pixel = cCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
          colorSet.add(hex);
        }
      }
    });

    colorSet.forEach(hex => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = hex;
      swatch.title = hex;
      swatch.onclick = () => {
        if (activeColorTarget === 'inner') {
          innerColor.value = hex;
          innerPill.style.backgroundColor = hex;
        } else {
          outerColor.value = hex;
          outerPill.style.backgroundColor = hex;
        }
      };
      paletteArea.appendChild(swatch);
    });
  }

  // Trigger Interactive Modal depending on mode
  generateBtn.addEventListener('click', () => {
    const mode = sizeMode.value;

    if (mode === 'placeSquares') {
      transforms = rawImages.map(() => ({ scale: 1, rot: 0, x: 0, y: 0 }));
      currentSingleIdx = 0;
      photoSelectorGroup.style.display = 'none';
      openSingleSquareModal(0);
    } else if (mode === 'placeOneSquare') {
      calculateInitialMasterGridTransforms();
      activeMasterIdx = 0;
      photoSelectorGroup.style.display = 'block';
      buildMasterPhotoSelector();
      openMasterSquareModal();
    } else {
      buildCollage();
    }
  });

  // Calculate Initial Non-Overlapping Layout for Master Swatch Mode
  function calculateInitialMasterGridTransforms() {
    let maxEdge = 0;
    rawImages.forEach(img => {
      const edge = Math.max(img.width, img.height);
      if (edge > maxEdge) maxEdge = edge;
    });

    const s = parseInt(innerSpacing.value, 10);
    const canvasSize = maxEdge + s;

    const count = rawImages.length;
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);

    const cellW = canvasSize / cols;
    const cellH = canvasSize / rows;

    transforms = rawImages.map((img, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);

      // Center of cell relative to canvas center (0,0)
      const cellCenterX = (col * cellW + cellW / 2) - (canvasSize / 2);
      const cellCenterY = (row * cellH + cellH / 2) - (canvasSize / 2);

      // Scale photo to fit neatly within its grid quadrant
      const maxImgDim = Math.max(img.width, img.height);
      const fitScale = (Math.min(cellW, cellH) * 0.8) / maxImgDim;

      return {
        scale: Math.min(1, parseFloat(fitScale.toFixed(2))),
        rot: 0,
        x: Math.round(cellCenterX),
        y: Math.round(cellCenterY)
      };
    });
  }

  // Mode: "Edit places in squares"
  function openSingleSquareModal(idx) {
    editorModal.style.display = 'flex';
    modalTitle.textContent = `Edit Placement: Photo ${idx + 1} of ${rawImages.length}`;
    modalDoneBtn.textContent = (idx < rawImages.length - 1) ? "Save & Next Photo" : "Finish & Build Collage";

    const img = rawImages[idx];
    const s = parseInt(innerSpacing.value, 10);
    const maxDim = Math.max(img.width, img.height);
    
    modalCanvas.width = maxDim + s;
    modalCanvas.height = maxDim + s;

    const t = transforms[idx];
    modScale.value = t.scale;
    modRotate.value = t.rot;
    modX.value = t.x;
    modY.value = t.y;

    renderSingleSquareCanvas();
  }

  function renderSingleSquareCanvas() {
    const img = rawImages[currentSingleIdx];
    mCtx.fillStyle = innerColor.value;
    mCtx.fillRect(0, 0, modalCanvas.width, modalCanvas.height);

    mCtx.save();
    mCtx.translate(modalCanvas.width / 2 + parseInt(modX.value, 10), modalCanvas.height / 2 + parseInt(modY.value, 10));
    mCtx.rotate(parseInt(modRotate.value, 10) * Math.PI / 180);
    mCtx.scale(parseFloat(modScale.value), parseFloat(modScale.value));
    mCtx.drawImage(img, -img.width / 2, -img.height / 2);
    mCtx.restore();
  }

  // Mode: "Edit places in one square"
  function buildMasterPhotoSelector() {
    photoBtnList.innerHTML = '';
    rawImages.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = `target-select-btn ${idx === activeMasterIdx ? 'active' : ''}`;
      btn.textContent = `Photo ${idx + 1}`;
      btn.onclick = () => {
        saveCurrentTransform(activeMasterIdx);
        activeMasterIdx = idx;
        buildMasterPhotoSelector();
        loadControlsForPhoto(idx);
        renderMasterSquareCanvas();
      };
      photoBtnList.appendChild(btn);
    });
  }

  function openMasterSquareModal() {
    editorModal.style.display = 'flex';
    modalTitle.textContent = "Edit Placement on Master Swatch";
    modalDoneBtn.textContent = "Finish & Build Collage";

    let maxEdge = 0;
    rawImages.forEach(img => {
      const edge = Math.max(img.width, img.height);
      if (edge > maxEdge) maxEdge = edge;
    });

    const s = parseInt(innerSpacing.value, 10);
    modalCanvas.width = maxEdge + s;
    modalCanvas.height = maxEdge + s;

    loadControlsForPhoto(activeMasterIdx);
    renderMasterSquareCanvas();
  }

  function loadControlsForPhoto(idx) {
    const t = transforms[idx];
    modScale.value = t.scale;
    modRotate.value = t.rot;
    modX.value = t.x;
    modY.value = t.y;
  }

  function renderMasterSquareCanvas() {
    mCtx.fillStyle = innerColor.value;
    mCtx.fillRect(0, 0, modalCanvas.width, modalCanvas.height);

    rawImages.forEach((img, idx) => {
      const t = (idx === activeMasterIdx) ? {
        scale: parseFloat(modScale.value),
        rot: parseInt(modRotate.value, 10),
        x: parseInt(modX.value, 10),
        y: parseInt(modY.value, 10)
      } : transforms[idx];

      const centerX = modalCanvas.width / 2 + t.x;
      const centerY = modalCanvas.height / 2 + t.y;

      mCtx.save();
      mCtx.translate(centerX, centerY);
      mCtx.rotate(t.rot * Math.PI / 180);
      mCtx.scale(t.scale, t.scale);
      mCtx.drawImage(img, -img.width / 2, -img.height / 2);
      mCtx.restore();

      // Draw Number Badge over photo center
      mCtx.save();
      mCtx.beginPath();
      mCtx.arc(centerX, centerY, 16, 0, 2 * Math.PI);
      mCtx.fillStyle = (idx === activeMasterIdx) ? '#007aff' : 'rgba(0,0,0,0.7)';
      mCtx.fill();
      mCtx.strokeStyle = '#ffffff';
      mCtx.lineWidth = 2;
      mCtx.stroke();

      mCtx.fillStyle = '#ffffff';
      mCtx.font = 'bold 14px -apple-system, sans-serif';
      mCtx.textAlign = 'center';
      mCtx.textBaseline = 'middle';
      mCtx.fillText(idx + 1, centerX, centerY);
      mCtx.restore();
    });
  }

  function saveCurrentTransform(idx) {
    transforms[idx] = {
      scale: parseFloat(modScale.value),
      rot: parseInt(modRotate.value, 10),
      x: parseInt(modX.value, 10),
      y: parseInt(modY.value, 10)
    };
  }

  // Live Slider Handlers
  [modScale, modRotate, modX, modY].forEach(el => {
    el.addEventListener('input', () => {
      if (sizeMode.value === 'placeSquares') {
        renderSingleSquareCanvas();
      } else {
        saveCurrentTransform(activeMasterIdx);
        renderMasterSquareCanvas();
      }
    });
  });

  // Modal Done Button Handler
  modalDoneBtn.addEventListener('click', () => {
    if (sizeMode.value === 'placeSquares') {
      saveCurrentTransform(currentSingleIdx);
      currentSingleIdx++;
      if (currentSingleIdx < rawImages.length) {
        openSingleSquareModal(currentSingleIdx);
      } else {
        editorModal.style.display = 'none';
        buildCollage();
      }
    } else {
      saveCurrentTransform(activeMasterIdx);
      editorModal.style.display = 'none';
      buildCollage();
    }
  });

  // Main Assembly Engine
  function buildCollage() {
    const s = parseInt(innerSpacing.value, 10);
    const b = parseInt(outerSpacing.value, 10);
    const mode = sizeMode.value;
    const mask = maskMode.value;

    let processed = [];

    if (mode === 'placeOneSquare') {
      let maxEdge = 0;
      rawImages.forEach(img => {
        const edge = Math.max(img.width, img.height);
        if (edge > maxEdge) maxEdge = edge;
      });

      const masterCanvas = document.createElement('canvas');
      masterCanvas.width = maxEdge + s;
      masterCanvas.height = maxEdge + s;
      const mCtxOut = masterCanvas.getContext('2d');

      mCtxOut.fillStyle = innerColor.value;
      mCtxOut.fillRect(0, 0, masterCanvas.width, masterCanvas.height);

      rawImages.forEach((img, idx) => {
        const t = transforms[idx];
        mCtxOut.save();
        mCtxOut.translate(masterCanvas.width / 2 + t.x, masterCanvas.height / 2 + t.y);
        mCtxOut.rotate(t.rot * Math.PI / 180);
        mCtxOut.scale(t.scale, t.scale);
        mCtxOut.drawImage(img, -img.width / 2, -img.height / 2);
        mCtxOut.restore();
      });

      processed = [masterCanvas];
    } else {
      // Find universal minimum edge for uniform square cropping
      let minEdge = Infinity;
      rawImages.forEach(img => {
        const edge = Math.min(img.width, img.height);
        if (edge < minEdge) minEdge = edge;
      });

      processed = rawImages.map((img, idx) => {
        if (mode === 'square') {
          // Crop to exact uniform square dimensions across ALL images
          const c = document.createElement('canvas');
          c.width = minEdge; 
          c.height = minEdge;
          const srcDim = Math.min(img.width, img.height);
          c.getContext('2d').drawImage(
            img, 
            (img.width - srcDim) / 2, (img.height - srcDim) / 2, srcDim, srcDim, 
            0, 0, minEdge, minEdge
          );
          return c;
        } 
        else if (mode === 'sameHeight') {
          const targetH = 400;
          const targetW = Math.round(targetH * (img.width / img.height));
          const c = document.createElement('canvas');
          c.width = targetW; c.height = targetH;
          c.getContext('2d').drawImage(img, 0, 0, targetW, targetH);
          return c;
        } 
        else if (mode === 'sameWidth') {
          const targetW = 400;
          const targetH = Math.round(targetW * (img.height / img.width));
          const c = document.createElement('canvas');
          c.width = targetW; c.height = targetH;
          c.getContext('2d').drawImage(img, 0, 0, targetW, targetH);
          return c;
        }
        else if (mode === 'placeSquares') {
          const maxEdge = Math.max(img.width, img.height);
          const c = document.createElement('canvas');
          c.width = maxEdge + s; c.height = maxEdge + s;
          const cCtx = c.getContext('2d');
          cCtx.fillStyle = innerColor.value;
          cCtx.fillRect(0, 0, c.width, c.height);

          const t = transforms[idx];
          cCtx.save();
          cCtx.translate(c.width / 2 + t.x, c.height / 2 + t.y);
          cCtx.rotate(t.rot * Math.PI / 180);
          cCtx.scale(t.scale, t.scale);
          cCtx.drawImage(img, -img.width / 2, -img.height / 2);
          cCtx.restore();
          return c;
        }
        else if (mode === 'padSquareMax') {
          const maxEdge = Math.max(img.width, img.height);
          const c = document.createElement('canvas');
          c.width = maxEdge; c.height = maxEdge;
          const cCtx = c.getContext('2d');
          cCtx.fillStyle = innerColor.value;
          cCtx.fillRect(0, 0, c.width, c.height);
          cCtx.drawImage(img, (maxEdge - img.width) / 2, (maxEdge - img.height) / 2);
          return c;
        }
        return img;
      });
    }

    // Step 2: Apply Mask
    processed = processed.map(img => {
      if (mask === 'none') return img;

      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const cCtx = c.getContext('2d');

      cCtx.fillStyle = innerColor.value;
      cCtx.fillRect(0, 0, c.width, c.height);

      cCtx.save();
      cCtx.beginPath();
      if (mask === 'rounded') {
        const r = parseInt(cornerRadius.value, 10);
        cCtx.roundRect(0, 0, c.width, c.height, r);
      } else if (mask === 'ellipse') {
        cCtx.ellipse(c.width / 2, c.height / 2, c.width / 2, c.height / 2, 0, 0, 2 * Math.PI);
      }
      cCtx.clip();
      cCtx.drawImage(img, 0, 0);
      cCtx.restore();

      return c;
    });

    // Step 3: Layout & Stitching
    const layout = layoutType.value;
    let collageCanvas = document.createElement('canvas');
    let cCtx = collageCanvas.getContext('2d');

    if (layout === 'horizontal') {
      let totalW = s;
      let maxH = 0;
      processed.forEach(img => {
        totalW += img.width + s;
        if (img.height > maxH) maxH = img.height;
      });
      collageCanvas.width = totalW;
      collageCanvas.height = maxH + (s * 2);

      cCtx.fillStyle = innerColor.value;
      cCtx.fillRect(0, 0, collageCanvas.width, collageCanvas.height);

      let curX = s;
      processed.forEach(img => {
        cCtx.drawImage(img, curX, (collageCanvas.height - img.height) / 2);
        curX += img.width + s;
      });
    }
    else if (layout === 'vertical') {
      let totalH = s;
      let maxW = 0;
      processed.forEach(img => {
        totalH += img.height + s;
        if (img.width > maxW) maxW = img.width;
      });
      collageCanvas.width = maxW + (s * 2);
      collageCanvas.height = totalH;

      cCtx.fillStyle = innerColor.value;
      cCtx.fillRect(0, 0, collageCanvas.width, collageCanvas.height);

      let curY = s;
      processed.forEach(img => {
        cCtx.drawImage(img, (collageCanvas.width - img.width) / 2, curY);
        curY += img.height + s;
      });
    }
    else { // Grid
      const cols = parseInt(gridCols.value, 10);
      const rows = Math.ceil(processed.length / cols);

      let maxCellW = 0, maxCellH = 0;
      processed.forEach(img => {
        if (img.width > maxCellW) maxCellW = img.width;
        if (img.height > maxCellH) maxCellH = img.height;
      });

      collageCanvas.width = (maxCellW * cols) + (s * (cols + 1));
      collageCanvas.height = (maxCellH * rows) + (s * (rows + 1));

      cCtx.fillStyle = innerColor.value;
      cCtx.fillRect(0, 0, collageCanvas.width, collageCanvas.height);

      processed.forEach((img, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const x = s + col * (maxCellW + s) + (maxCellW - img.width) / 2;
        const y = s + row * (maxCellH + s) + (maxCellH - img.height) / 2;
        cCtx.drawImage(img, x, y);
      });
    }

    // Step 4: Inner Swatch Overlay
    let innerSwatchCanvas = document.createElement('canvas');
    innerSwatchCanvas.width = collageCanvas.width + (s * 2);
    innerSwatchCanvas.height = collageCanvas.height + (s * 2);
    let iCtx = innerSwatchCanvas.getContext('2d');
    iCtx.fillStyle = innerColor.value;
    iCtx.fillRect(0, 0, innerSwatchCanvas.width, innerSwatchCanvas.height);
    iCtx.drawImage(collageCanvas, s, s);

    // Step 5: Outer Border Matte
    const finalW = innerSwatchCanvas.width + (b * 2);
    const finalH = innerSwatchCanvas.height + (b * 2);

    canvas.width = finalW;
    canvas.height = finalH;

    ctx.fillStyle = outerColor.value;
    ctx.fillRect(0, 0, finalW, finalH);
    ctx.drawImage(innerSwatchCanvas, b, b);
  }
</script>
