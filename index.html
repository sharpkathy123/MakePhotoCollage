<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grid Collage Generator</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grid Collage">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/grid-2.png">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #007aff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
      --success-color: #34c759;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 12px;
      text-align: center;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      color: var(--accent-color);
    }

    .control {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .control.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
    }

    input[type="file"], select, input[type="range"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fafafa;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .control {
      flex: 1;
    }

    .btn-save {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 14px;
    }

    .btn-secondary {
      background-color: #e5e5ea;
      color: #1c1c1e;
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save:disabled {
      background-color: #c7c7cc;
      cursor: not-allowed;
    }

    .color-target-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .target-btn {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .target-btn.active {
      border-color: var(--accent-color);
      background: #eef6ff;
      color: var(--accent-color);
    }

    .color-picker-box {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      background: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }
    .color-picker-box::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-box::-webkit-color-swatch { border: none; border-radius: 50%; }

    .color-picker-box.transparent-active::-webkit-color-swatch {
      background: repeating-linear-gradient(45deg, #ccc, #ccc 4px, #fff 4px, #fff 8px);
    }

    .palette-container {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 0;
    }

    .palette-swatches {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px var(--border-color);
      cursor: pointer;
    }

    .swatch-none {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid #ff3b30;
      background: repeating-linear-gradient(45deg, #ccc, #ccc 4px, #fff 4px, #fff 8px);
      box-shadow: 0 0 0 1px var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: bold;
      color: #ff3b30;
    }

    #canvas-container {
      margin-top: 16px;
      text-align: center;
      position: relative;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-image: repeating-linear-gradient(45deg, #e5e5ea 25%, transparent 25%, transparent 75%, #e5e5ea 75%, #e5e5ea), repeating-linear-gradient(45deg, #e5e5ea 25%, #ffffff 25%, #ffffff 75%, #e5e5ea 75%, #e5e5ea);
      background-position: 0 0, 9px 9px;
      background-size: 18px 18px;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .touch-hint {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-top: 4px;
      font-weight: 500;
    }

    .photo-controls-card {
      background: #f8f9fa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .version-stamp {
      font-size: 0.7rem;
      color: #8e8e93;
      text-align: center;
      margin-top: 16px;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Grid Collage Generator</h1>

  <div class="control">
    <label for="imgInput">1. Select Photos</label>
    <input type="file" id="imgInput" accept="image/*" multiple>
  </div>

  <div id="canvas-container">
    <canvas id="collageCanvas"></canvas>
    <div class="touch-hint" id="touchHint" style="display:none;">🖐 Tap photo to select &bull; Drag to move &bull; Pinch to zoom</div>
  </div>

  <!-- Active Photo Controls -->
  <div class="photo-controls-card" id="photoControls" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span style="font-size:0.85rem; font-weight:700; color:var(--accent-color);" id="selectedPhotoLabel">Photo 1 Selected</span>
      <button class="btn-secondary" type="button" onclick="resetSelectedTransform()">Reset Photo</button>
    </div>
    <div class="row">
      <div class="control">
        <label>Scale: <span id="scaleVal">1.0</span></label>
        <input type="range" id="modScale" min="0.1" max="3" step="0.05" value="1">
      </div>
      <div class="control">
        <label>Rotation: <span id="rotVal">0°</span></label>
        <input type="range" id="modRotate" min="-180" max="180" value="0">
      </div>
    </div>
  </div>

  <div class="section-title">2. Layout & Columns</div>
  <div class="row">
    <div class="control">
      <label for="layoutType">Arrangement</label>
      <select id="layoutType">
        <option value="grid">Grid</option>
        <option value="horizontal">Horizontal Strip</option>
        <option value="vertical">Vertical Feed</option>
      </select>
    </div>
    <div class="control disabled" id="gridColsGroup">
      <label for="gridCols">Columns</label>
      <select id="gridCols" disabled>
        <option value="">Select Photos First</option>
      </select>
    </div>
  </div>

  <div class="section-title">3. Spacing & Colors</div>
  <div class="row">
    <div class="control">
      <label for="innerSpacing">Photo Gap: <span id="innerSpacingVal">16px</span></label>
      <input type="range" id="innerSpacing" min="0" max="100" value="16">
    </div>
    <div class="control">
      <label for="outerSpacing">Outer Border: <span id="outerSpacingVal">24px</span></label>
      <input type="range" id="outerSpacing" min="0" max="150" value="24">
    </div>
  </div>

  <div class="control">
    <label>Color Target</label>
    <div class="color-target-toggle">
      <button class="target-btn active" id="targetInnerBtn" type="button" onclick="setActiveColorTarget('inner')">
        <span>Inner Gap</span>
        <input type="color" class="color-picker-box" id="innerColor" value="#ffffff">
      </button>
      <button class="target-btn" id="targetOuterBtn" type="button" onclick="setActiveColorTarget('outer')">
        <span>Outer Border</span>
        <input type="color" class="color-picker-box" id="outerColor" value="#1c1c1e">
      </button>
    </div>
  </div>

  <div class="control disabled" id="paletteGroup">
    <label>Sampled Palette:</label>
    <div class="palette-container">
      <div class="palette-swatches" id="paletteArea">
        <div class="swatch-none" title="Transparent" onclick="setTransparentColor()">None</div>
      </div>
    </div>
  </div>

  <div class="section-title">4. Photo Masking</div>
  <div class="row">
    <div class="control">
      <label for="maskMode">Mask Shape</label>
      <select id="maskMode">
        <option value="none">None (Original Aspect)</option>
        <option value="square">Square (1:1)</option>
        <option value="circle">Circle</option>
        <option value="ellipse">Ellipse / Oval</option>
        <option value="rounded">Rounded Rectangle</option>
      </select>
    </div>
    <div class="control">
      <label for="maskBehavior">Mask Pan Behavior</label>
      <select id="maskBehavior">
        <option value="fixed">Fixed Window (Pan inside frame)</option>
        <option value="attached">Attached (Mask moves with photo)</option>
      </select>
    </div>
  </div>

  <div class="control disabled" id="radiusGroup">
    <label for="cornerRadius">Corner Radius: <span id="radiusVal">30px</span></label>
    <input type="range" id="cornerRadius" min="0" max="150" value="30">
  </div>

  <button class="btn-save" id="saveBtn" disabled>Save / Share Collage</button>

  <div class="version-stamp">
    Updated: <span>2026-08-18 19:02</span>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=202608181902').catch(err => {
        console.log('SW registration failed:', err);
      });
    });
  }

  // DOM Elements
  const imgInput = document.getElementById('imgInput');
  const innerSpacing = document.getElementById('innerSpacing');
  const outerSpacing = document.getElementById('outerSpacing');
  const innerSpacingVal = document.getElementById('innerSpacingVal');
  const outerSpacingVal = document.getElementById('outerSpacingVal');
  const innerColor = document.getElementById('innerColor');
  const outerColor = document.getElementById('outerColor');
  const targetInnerBtn = document.getElementById('targetInnerBtn');
  const targetOuterBtn = document.getElementById('targetOuterBtn');
  const paletteGroup = document.getElementById('paletteGroup');
  const paletteArea = document.getElementById('paletteArea');
  const layoutType = document.getElementById('layoutType');
  const gridCols = document.getElementById('gridCols');
  const gridColsGroup = document.getElementById('gridColsGroup');
  const maskMode = document.getElementById('maskMode');
  const maskBehavior = document.getElementById('maskBehavior');
  const cornerRadius = document.getElementById('cornerRadius');
  const radiusGroup = document.getElementById('radiusGroup');
  const radiusVal = document.getElementById('radiusVal');
  const canvas = document.getElementById('collageCanvas');
  const ctx = canvas.getContext('2d');
  const saveBtn = document.getElementById('saveBtn');
  const touchHint = document.getElementById('touchHint');
  const photoControls = document.getElementById('photoControls');
  const selectedPhotoLabel = document.getElementById('selectedPhotoLabel');
  const modScale = document.getElementById('modScale');
  const modRotate = document.getElementById('modRotate');
  const scaleVal = document.getElementById('scaleVal');
  const rotVal = document.getElementById('rotVal');

  // Application State
  let activeColorTarget = 'inner';
  let innerColorVal = '#ffffff';
  let outerColorVal = '#1c1c1e';
  let rawImages = [];
  let transforms = [];
  let selectedIdx = 0;
  let cellBounds = [];
  let activeCols = 3;

  // Gesture State
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let initialTransform = { x: 0, y: 0 };
  let initialPinchDist = null;
  let initialPinchScale = 1;
  let animFrameId = null;

  function setActiveColorTarget(target) {
    activeColorTarget = target;
    targetInnerBtn.classList.toggle('active', target === 'inner');
    targetOuterBtn.classList.toggle('active', target === 'outer');
  }

  innerColor.addEventListener('input', (e) => {
    if (activeColorTarget === 'inner') {
      innerColorVal = e.target.value;
      innerColor.classList.remove('transparent-active');
      requestRender();
    }
  });
  outerColor.addEventListener('input', (e) => {
    if (activeColorTarget === 'outer') {
      outerColorVal = e.target.value;
      outerColor.classList.remove('transparent-active');
      requestRender();
    }
  });

  function setTransparentColor() {
    if (activeColorTarget === 'inner') {
      innerColorVal = 'none';
      innerColor.classList.add('transparent-active');
    } else {
      outerColorVal = 'none';
      outerColor.classList.add('transparent-active');
    }
    requestRender();
  }

  // Pure Math Calculation for Best Smart Grid Layout
  // Rule 1: Zero-hole square preference.
  // Rule 2: Wider-than-tall (cols >= rows) preference.
  // Rule 3: Cap at 5 columns unless items exceed 25 (5x5).
  function computeOptimalColumns(itemCount) {
    if (!itemCount || itemCount <= 0) return 1;

    const maxCols = itemCount > 25 ? Math.ceil(Math.sqrt(itemCount)) : Math.min(5, itemCount);
    let bestCols = 1;
    let lowestPenalty = Infinity;

    for (let cols = 1; cols <= maxCols; cols++) {
      const rows = Math.ceil(itemCount / cols);
      const holes = (rows * cols) - itemCount;
      const isWiderOrEqual = cols >= rows;

      const orientationPenalty = isWiderOrEqual ? 0 : 50;
      const squarenessDiff = Math.abs((cols / rows) - 1.0);
      const holePenalty = holes * 10;

      const penalty = orientationPenalty + (squarenessDiff * 20) + holePenalty;

      if (penalty < lowestPenalty) {
        lowestPenalty = penalty;
        bestCols = cols;
      }
    }
    return bestCols;
  }

  function syncColumnDropdown(itemCount, selectedCols) {
    if (!itemCount) return;

    gridCols.innerHTML = '';
    const maxOption = Math.max(5, itemCount);

    for (let c = 1; c <= maxOption; c++) {
      const opt = document.createElement('option');
      opt.value = String(c);
      opt.textContent = `${c} Column${c > 1 ? 's' : ''}`;
      if (c === selectedCols) opt.selected = true;
      gridCols.appendChild(opt);
    }

    gridCols.disabled = false;
    gridColsGroup.classList.remove('disabled');
  }

  function updateUI() {
    radiusGroup.classList.toggle('disabled', maskMode.value !== 'rounded');
    gridColsGroup.classList.toggle('disabled', layoutType.value !== 'grid');
  }

  // File Upload Handler
  imgInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    try {
      rawImages = await Promise.all(files.map(file => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load image file'));
          img.src = URL.createObjectURL(file);
        });
      }));

      transforms = rawImages.map(() => ({ scale: 1, rot: 0, x: 0, y: 0 }));
      selectedIdx = 0;

      activeCols = computeOptimalColumns(rawImages.length);
      
      syncColumnDropdown(rawImages.length, activeCols);
      extractSortedPalette(rawImages);
      
      paletteGroup.classList.remove('disabled');
      touchHint.style.display = 'block';
      photoControls.style.display = 'block';
      saveBtn.disabled = false;
      
      updateUI();
      syncSliderControls();
      requestRender();
    } catch (err) {
      console.error('Error loading uploaded photos:', err);
    }
  });

  gridCols.addEventListener('change', (e) => {
    const val = parseInt(e.target.value, 10);
    if (!isNaN(val) && val > 0) {
      activeCols = val;
      requestRender();
    }
  });

  function syncSliderControls() {
    if (!transforms[selectedIdx]) return;
    const t = transforms[selectedIdx];
    modScale.value = t.scale;
    modRotate.value = t.rot;
    scaleVal.textContent = parseFloat(t.scale).toFixed(2);
    rotVal.textContent = `${t.rot}°`;
    selectedPhotoLabel.textContent = `Photo ${selectedIdx + 1} Selected`;
  }

  modScale.addEventListener('input', () => {
    if (transforms[selectedIdx]) {
      transforms[selectedIdx].scale = parseFloat(modScale.value);
      scaleVal.textContent = parseFloat(modScale.value).toFixed(2);
      requestRender();
    }
  });

  modRotate.addEventListener('input', () => {
    if (transforms[selectedIdx]) {
      transforms[selectedIdx].rot = parseInt(modRotate.value, 10);
      rotVal.textContent = `${modRotate.value}°`;
      requestRender();
    }
  });

  function resetSelectedTransform() {
    if (transforms[selectedIdx]) {
      transforms[selectedIdx] = { scale: 1, rot: 0, x: 0, y: 0 };
      syncSliderControls();
      requestRender();
    }
  }

  // Live Listeners
  [innerSpacing, outerSpacing, layoutType, maskMode, maskBehavior, cornerRadius].forEach(el => {
    el.addEventListener('input', () => {
      if (el === innerSpacing) innerSpacingVal.textContent = `${innerSpacing.value}px`;
      if (el === outerSpacing) outerSpacingVal.textContent = `${outerSpacing.value}px`;
      if (el === maskMode) updateUI();
      if (el === cornerRadius) radiusVal.textContent = `${cornerRadius.value}px`;
      requestRender();
    });
  });

  function requestRender() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(renderCollage);
  }

  function calculateFitDimensions(imgWidth, imgHeight, maxW, maxH) {
    if (!imgWidth || !imgHeight) return { w: maxW, h: maxH };
    const ratio = Math.min(maxW / imgWidth, maxH / imgHeight);
    return {
      w: Math.round(imgWidth * ratio),
      h: Math.round(imgHeight * ratio)
    };
  }

  // Main Canvas Render Engine (Capped total cell size to 600px max to protect iPad memory limits)
  function renderCollage() {
    if (!rawImages.length) return;

    const s = parseInt(innerSpacing.value, 10) || 0;
    const b = parseInt(outerSpacing.value, 10) || 0;
    const layout = layoutType.value;
    
    const cols = Math.max(1, activeCols || 1);
    const rows = Math.max(1, Math.ceil(rawImages.length / cols));
    
    const mask = maskMode.value;
    const behavior = maskBehavior.value;
    const r = parseInt(cornerRadius.value, 10) || 0;

    // HARD CANVAS MEMORY SAFETY GUARD:
    // Cap target cell size so canvas resolution NEVER exceeds Safari memory limits
    const maxCellSize = 600;

    cellBounds = [];

    let totalW = 0, totalH = 0;
    if (layout === 'grid') {
      totalW = (maxCellSize * cols) + (s * (cols + 1));
      totalH = (maxCellSize * rows) + (s * (rows + 1));
    } else if (layout === 'horizontal') {
      totalW = (maxCellSize * rawImages.length) + (s * (rawImages.length + 1));
      totalH = maxCellSize + (s * 2);
    } else { // vertical
      totalW = maxCellSize + (s * 2);
      totalH = (maxCellSize * rawImages.length) + (s * (rawImages.length + 1));
    }

    const collageW = totalW + (b * 2);
    const collageH = totalH + (b * 2);

    canvas.width = Math.max(1, collageW);
    canvas.height = Math.max(1, collageH);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Outer Frame Background
    if (b > 0 && outerColorVal !== 'none') {
      ctx.fillStyle = outerColorVal;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Inner Area Background
    if (innerColorVal !== 'none') {
      ctx.fillStyle = innerColorVal;
      ctx.fillRect(b, b, totalW, totalH);
    }

    // Draw Image Cells
    rawImages.forEach((img, idx) => {
      let cellX = 0, cellY = 0;
      if (layout === 'grid') {
        const c = idx % cols;
        const rw = Math.floor(idx / cols);
        cellX = b + s + c * (maxCellSize + s);
        cellY = b + s + rw * (maxCellSize + s);
      } else if (layout === 'horizontal') {
        cellX = b + s + idx * (maxCellSize + s);
        cellY = b + s;
      } else { // vertical
        cellX = b + s;
        cellY = b + s + idx * (maxCellSize + s);
      }

      cellBounds.push({ idx, x: cellX, y: cellY, w: maxCellSize, h: maxCellSize });

      const t = transforms[idx] || { scale: 1, rot: 0, x: 0, y: 0 };
      const centerX = cellX + maxCellSize / 2;
      const centerY = cellY + maxCellSize / 2;

      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      const fit = calculateFitDimensions(imgW, imgH, maxCellSize, maxCellSize);

      ctx.save();

      if (behavior === 'fixed') {
        applyMaskPath(ctx, mask, cellX, cellY, maxCellSize, maxCellSize, r);
        ctx.clip();

        ctx.translate(centerX + t.x, centerY + t.y);
        ctx.rotate(t.rot * Math.PI / 180);
        ctx.scale(t.scale, t.scale);
        ctx.drawImage(img, -fit.w / 2, -fit.h / 2, fit.w, fit.h);
      } else {
        ctx.translate(centerX + t.x, centerY + t.y);
        ctx.rotate(t.rot * Math.PI / 180);
        ctx.scale(t.scale, t.scale);

        applyMaskPath(ctx, mask, -fit.w / 2, -fit.h / 2, fit.w, fit.h, r);
        ctx.clip();

        ctx.drawImage(img, -fit.w / 2, -fit.h / 2, fit.w, fit.h);
      }

      ctx.restore();

      // Selected Highlight Ring
      if (idx === selectedIdx) {
        ctx.save();
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth = Math.max(4, Math.round(maxCellSize * 0.015));
        ctx.strokeRect(cellX, cellY, maxCellSize, maxCellSize);

        ctx.beginPath();
        ctx.arc(cellX + 16, cellY + 16, 12, 0, 2 * Math.PI);
        ctx.fillStyle = '#007aff';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(idx + 1, cellX + 16, cellY + 16);
        ctx.restore();
      }
    });
  }

  function applyMaskPath(cCtx, type, x, y, w, h, radius) {
    cCtx.beginPath();
    if (type === 'square' || type === 'none') {
      cCtx.rect(x, y, w, h);
    } else if (type === 'circle') {
      const minDim = Math.min(w, h);
      cCtx.arc(x + w / 2, y + h / 2, minDim / 2, 0, 2 * Math.PI);
    } else if (type === 'ellipse') {
      cCtx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
    } else if (type === 'rounded') {
      cCtx.roundRect(x, y, w, h, Math.min(radius, Math.min(w, h) / 2));
    }
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleFactor = canvas.width / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleFactor,
      y: (clientY - rect.top) * scaleFactor
    };
  }

  function hitTestCell(x, y) {
    for (let i = cellBounds.length - 1; i >= 0; i--) {
      const b = cellBounds[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        return b.idx;
      }
    }
    return -1;
  }

  // Touch / Drag Handlers
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const coords = getCanvasCoords(e);
      const hit = hitTestCell(coords.x, coords.y);
      if (hit !== -1) {
        selectedIdx = hit;
        syncSliderControls();
      }
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      initialTransform = { ...transforms[selectedIdx] };
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialPinchScale = transforms[selectedIdx] ? transforms[selectedIdx].scale : 1;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1 && transforms[selectedIdx]) {
      const rect = canvas.getBoundingClientRect();
      const scaleFactor = canvas.width / rect.width;
      const dx = (e.touches[0].clientX - dragStart.x) * scaleFactor;
      const dy = (e.touches[0].clientY - dragStart.y) * scaleFactor;

      transforms[selectedIdx].x = Math.round(initialTransform.x + dx);
      transforms[selectedIdx].y = Math.round(initialTransform.y + dy);
      requestRender();
    } else if (e.touches.length === 2 && initialPinchDist && transforms[selectedIdx]) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const zoom = dist / initialPinchDist;
      const newScale = Math.min(3, Math.max(0.1, parseFloat((initialPinchScale * zoom).toFixed(2))));
      transforms[selectedIdx].scale = newScale;
      syncSliderControls();
      requestRender();
    }
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    initialPinchDist = null;
  });

  // Mouse Handlers
  canvas.addEventListener('mousedown', (e) => {
    const coords = getCanvasCoords(e);
    const hit = hitTestCell(coords.x, coords.y);
    if (hit !== -1) {
      selectedIdx = hit;
      syncSliderControls();
    }
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    initialTransform = { ...transforms[selectedIdx] };
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging || !transforms[selectedIdx]) return;
    const rect = canvas.getBoundingClientRect();
    const scaleFactor = canvas.width / rect.width;
    const dx = (e.clientX - dragStart.x) * scaleFactor;
    const dy = (e.clientY - dragStart.y) * scaleFactor;

    transforms[selectedIdx].x = Math.round(initialTransform.x + dx);
    transforms[selectedIdx].y = Math.round(initialTransform.y + dy);
    requestRender();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  function extractSortedPalette(canvases) {
    const noneBtn = paletteArea.querySelector('.swatch-none');
    paletteArea.innerHTML = '';
    paletteArea.appendChild(noneBtn);

    const rawColors = [];
    canvases.forEach(c => {
      const cCtx = document.createElement('canvas').getContext('2d');
      cCtx.drawImage(c, 0, 0, 5, 5);
      const data = cCtx.getImageData(0, 0, 5, 5).data;
      for (let i = 0; i < data.length; i += 4) {
        const hex = "#" + ((1 << 24) + (data[i] << 16) + (data[i+1] << 8) + data[i+2]).toString(16).slice(1);
        rawColors.push({ hex, r: data[i], g: data[i+1], b: data[i+2] });
      }
    });

    const unique = [];
    rawColors.forEach(item => {
      if (!unique.some(u => Math.hypot(u.r-item.r, u.g-item.g, u.b-item.b) < 35)) {
        unique.push(item);
      }
    });

    unique.forEach(col => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = col.hex;
      swatch.onclick = () => {
        if (activeColorTarget === 'inner') {
          innerColorVal = col.hex; innerColor.value = col.hex;
        } else {
          outerColorVal = col.hex; outerColor.value = col.hex;
        }
        requestRender();
      };
      paletteArea.appendChild(swatch);
    });
  }

  // Native Share / Save
  saveBtn.addEventListener('click', () => {
    canvas.toBlob(async (blob) => {
      const fileName = `grid-collage-${Date.now()}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Grid Collage' });
        } catch (err) {
          if (err.name !== 'AbortError') fallbackDownload(blob, fileName);
        }
      } else {
        fallbackDownload(blob, fileName);
      }
    }, 'image/png');
  });

  function fallbackDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }

  updateUI();
</script>

</body>
</html>
