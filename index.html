<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grid Collage Generator</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grid Collage">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/grid-2.png">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #007aff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
      --success-color: #34c759;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 12px;
      text-align: center;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      color: var(--accent-color);
    }

    .control {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .control.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
    }

    input[type="file"], select, input[type="range"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fafafa;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .control {
      flex: 1;
    }

    .btn-save {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 14px;
    }

    .btn-secondary {
      background-color: #e5e5ea;
      color: #1c1c1e;
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save:disabled {
      background-color: #c7c7cc;
      cursor: not-allowed;
    }

    .btn-secondary.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .color-target-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .target-btn {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .target-btn.active {
      border-color: var(--accent-color);
      background: #eef6ff;
      color: var(--accent-color);
    }

    .color-picker-box {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      background: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }
    .color-picker-box::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-box::-webkit-color-swatch { border: none; border-radius: 50%; }

    .color-picker-box.transparent-active::-webkit-color-swatch {
      background: repeating-linear-gradient(45deg, #ccc, #ccc 4px, #fff 4px, #fff 8px);
    }

    .palette-container {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 0;
    }

    .palette-swatches {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px var(--border-color);
      cursor: pointer;
    }

    .swatch-none {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid #ff3b30;
      background: repeating-linear-gradient(45deg, #ccc, #ccc 4px, #fff 4px, #fff 8px);
      box-shadow: 0 0 0 1px var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: bold;
      color: #ff3b30;
    }

    #canvas-container {
      margin-top: 16px;
      text-align: center;
      position: relative;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-image: repeating-linear-gradient(45deg, #e5e5ea 25%, transparent 25%, transparent 75%, #e5e5ea 75%, #e5e5ea), repeating-linear-gradient(45deg, #e5e5ea 25%, #ffffff 25%, #ffffff 75%, #e5e5ea 75%, #e5e5ea);
      background-position: 0 0, 9px 9px;
      background-size: 18px 18px;
      touch-action: none;
      cursor: grab;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    .touch-hint {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-top: 4px;
      font-weight: 500;
    }

    .photo-controls-card {
      background: #f8f9fa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .button-group-inline {
      display: flex;
      gap: 6px;
    }

    .version-stamp {
      font-size: 0.7rem;
      color: #8e8e93;
      text-align: center;
      margin-top: 16px;
      user-select: none;
    }

    .photo-source-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .photo-source-row input[type="file"] {
      flex: 1;
      min-width: 0;
    }

    .photo-source-row .btn-secondary {
      flex-shrink: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Grid Collage Generator</h1>

  <div class="control">
    <label for="imgInput">1. Select Photos</label>
    <div class="photo-source-row">
      <input type="file" id="imgInput" accept="image/*" multiple>
      <button class="btn-secondary" type="button" id="gphotosImportBtn" onclick="importFromGooglePhotos()">📷 Google Photos</button>
    </div>
    <button class="btn-secondary" type="button" id="gphotosOpenPickerBtn" onclick="openGooglePhotosPickerTab()" style="display:none; width:100%; margin-top:6px;">🔗 Tap to Open Google Photos</button>
  </div>

  <div id="canvas-container">
    <canvas id="collageCanvas"></canvas>
    <div class="touch-hint" id="touchHint" style="display:none;">🖐 Tap photo to select &bull; Drag to move &bull; Pinch to zoom</div>
  </div>

  <!-- Active Photo Controls -->
  <div class="photo-controls-card" id="photoControls" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;">
      <span style="font-size:0.85rem; font-weight:700; color:var(--accent-color);" id="selectedPhotoLabel">Photo 1 Selected</span>
      <div class="button-group-inline">
        <button class="btn-secondary" type="button" id="multiSelectToggleBtn" onclick="toggleMultiSelectMode()">Select Multiple</button>
        <button class="btn-secondary" type="button" onclick="selectAllPhotos()">Select All</button>
        <button class="btn-secondary" type="button" onclick="deselectAllPhotos()">Deselect All</button>
        <button class="btn-secondary" type="button" onclick="resetSelectedTransform()">Reset Photo</button>
      </div>
    </div>
    <div class="touch-hint" id="multiSelectHint" style="display:none;">🖐 Multi-select on — tap photos to add/remove from selection</div>
    <div class="row">
      <div class="control">
        <label>Scale: <span id="scaleVal">1.0</span></label>
        <input type="range" id="modScale" min="0.1" max="3" step="0.05" value="1">
      </div>
      <div class="control">
        <label>Rotation: <span id="rotVal">0°</span></label>
        <input type="range" id="modRotate" min="-180" max="180" value="0">
      </div>
    </div>

    <div class="row">
      <div class="control">
        <label for="maskMode">Mask Shape</label>
        <select id="maskMode">
          <option value="none">None (Original Aspect)</option>
          <option value="square">Square (1:1)</option>
          <option value="circle">Circle</option>
          <option value="ellipse">Ellipse / Oval</option>
          <option value="rounded">Rounded Rectangle</option>
        </select>
      </div>
      <div class="control">
        <label for="maskBehavior">Mask Pan Behavior</label>
        <select id="maskBehavior">
          <option value="fixed">Fixed Window (Pan inside frame)</option>
          <option value="attached">Attached (Mask moves with photo)</option>
        </select>
      </div>
    </div>
    <div class="control disabled" id="radiusGroup">
      <label for="cornerRadius">Corner Radius: <span id="radiusVal">30px</span></label>
      <input type="range" id="cornerRadius" min="0" max="150" value="30">
    </div>
  </div>

  <div class="section-title">2. Layout & Columns</div>
  <div class="row">
    <div class="control">
      <label for="layoutType">Arrangement</label>
      <select id="layoutType">
        <option value="grid">Grid</option>
        <option value="horizontal">Horizontal Strip</option>
        <option value="vertical">Vertical Feed</option>
      </select>
    </div>
    <div class="control disabled" id="gridColsGroup">
      <label for="gridCols">Columns</label>
      <select id="gridCols" disabled>
        <option value="">Select Photos First</option>
      </select>
    </div>
  </div>

  <div class="section-title">3. Spacing & Colors</div>
  <div class="row">
    <div class="control">
      <label for="innerSpacing">Photo Gap: <span id="innerSpacingVal">16px</span></label>
      <input type="range" id="innerSpacing" min="0" max="100" value="16">
    </div>
    <div class="control">
      <label for="outerSpacing">Outer Border: <span id="outerSpacingVal">24px</span></label>
      <input type="range" id="outerSpacing" min="0" max="150" value="24">
    </div>
  </div>

  <div class="control">
    <label>Color Target</label>
    <div class="color-target-toggle">
      <button class="target-btn active" id="targetInnerBtn" type="button" onclick="setActiveColorTarget('inner')">
        <span>Inner Gap</span>
        <input type="color" class="color-picker-box" id="innerColor" value="#ffffff">
      </button>
      <button class="target-btn" id="targetOuterBtn" type="button" onclick="setActiveColorTarget('outer')">
        <span>Outer Border</span>
        <input type="color" class="color-picker-box" id="outerColor" value="#1c1c1e">
      </button>
    </div>
  </div>

  <div class="control disabled" id="paletteGroup">
    <label>Sampled Palette:</label>
    <div class="palette-container">
      <div class="palette-swatches" id="paletteArea">
        <div class="swatch-none" title="Transparent" onclick="setTransparentColor()">None</div>
      </div>
    </div>
  </div>

  <button class="btn-save" id="saveBtn" disabled>Save / Share Collage</button>

  <div class="version-stamp">
    Updated: <span id="updateTimestamp" data-updated-utc="2026-08-31T04:35:26Z">2026-08-31 04:35 UTC</span>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=202608312200').catch(err => {
        console.log('SW registration failed:', err);
      });
    });
  }

  // The footer timestamp is stamped in UTC at deploy time (there's no
  // single "local" time for a static site with visitors everywhere), so
  // convert it to each viewer's own local time here in the browser.
  (function () {
    const el = document.getElementById('updateTimestamp');
    const iso = el && el.getAttribute('data-updated-utc');
    if (!iso) return;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return;
    const pad = n => String(n).padStart(2, '0');
    el.textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  })();

  // DOM Elements
  const imgInput = document.getElementById('imgInput');
  const gphotosImportBtn = document.getElementById('gphotosImportBtn');
  const gphotosOpenPickerBtn = document.getElementById('gphotosOpenPickerBtn');
  const innerSpacing = document.getElementById('innerSpacing');
  const outerSpacing = document.getElementById('outerSpacing');
  const innerSpacingVal = document.getElementById('innerSpacingVal');
  const outerSpacingVal = document.getElementById('outerSpacingVal');
  const innerColor = document.getElementById('innerColor');
  const outerColor = document.getElementById('outerColor');
  const targetInnerBtn = document.getElementById('targetInnerBtn');
  const targetOuterBtn = document.getElementById('targetOuterBtn');
  const paletteGroup = document.getElementById('paletteGroup');
  const paletteArea = document.getElementById('paletteArea');
  const layoutType = document.getElementById('layoutType');
  const gridCols = document.getElementById('gridCols');
  const gridColsGroup = document.getElementById('gridColsGroup');
  const maskMode = document.getElementById('maskMode');
  const maskBehavior = document.getElementById('maskBehavior');
  const cornerRadius = document.getElementById('cornerRadius');
  const radiusGroup = document.getElementById('radiusGroup');
  const radiusVal = document.getElementById('radiusVal');
  const canvas = document.getElementById('collageCanvas');
  const ctx = canvas.getContext('2d');
  const saveBtn = document.getElementById('saveBtn');
  const touchHint = document.getElementById('touchHint');
  const photoControls = document.getElementById('photoControls');
  const selectedPhotoLabel = document.getElementById('selectedPhotoLabel');
  const modScale = document.getElementById('modScale');
  const modRotate = document.getElementById('modRotate');
  const scaleVal = document.getElementById('scaleVal');
  const rotVal = document.getElementById('rotVal');
  const multiSelectToggleBtn = document.getElementById('multiSelectToggleBtn');
  const multiSelectHint = document.getElementById('multiSelectHint');

  // Application State
  let activeColorTarget = 'inner';
  let innerColorVal = '#ffffff';
  let outerColorVal = '#1c1c1e';
  let rawImages = [];
  let transforms = [];
  let photoMasks = [];
  let selectedIndices = [0];
  let cellBounds = [];
  let activeCols = 3;
  let multiSelectMode = false;

  function defaultPhotoMask() {
    return { mode: 'none', behavior: 'fixed', radius: 30 };
  }

  // Gesture State
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let initialTransforms = {};
  let initialPinchDist = null;
  let initialPinchScale = 1;
  let animFrameId = null;

  function setActiveColorTarget(target) {
    activeColorTarget = target;
    targetInnerBtn.classList.toggle('active', target === 'inner');
    targetOuterBtn.classList.toggle('active', target === 'outer');
  }

  innerColor.addEventListener('input', (e) => {
    if (activeColorTarget === 'inner') {
      innerColorVal = e.target.value;
      innerColor.classList.remove('transparent-active');
      requestRender();
    }
  });
  outerColor.addEventListener('input', (e) => {
    if (activeColorTarget === 'outer') {
      outerColorVal = e.target.value;
      outerColor.classList.remove('transparent-active');
      requestRender();
    }
  });

  function setTransparentColor() {
    if (activeColorTarget === 'inner') {
      innerColorVal = 'none';
      innerColor.classList.add('transparent-active');
    } else {
      outerColorVal = 'none';
      outerColor.classList.add('transparent-active');
    }
    requestRender();
  }

  // Pure Smart Grid Column Calculator
  function computeOptimalColumns(itemCount) {
    if (!itemCount || itemCount <= 0) return 1;

    if (itemCount === 3 || itemCount === 5) {
      layoutType.value = 'horizontal';
      return itemCount;
    }

    layoutType.value = 'grid';

    const maxCols = itemCount > 25 ? Math.ceil(Math.sqrt(itemCount)) : Math.min(5, itemCount);
    let bestCols = 1;
    let lowestPenalty = Infinity;

    for (let cols = 1; cols <= maxCols; cols++) {
      const rows = Math.ceil(itemCount / cols);
      const holes = (rows * cols) - itemCount;
      const isWiderOrEqual = cols >= rows;

      const orientationPenalty = isWiderOrEqual ? 0 : 50;
      const squarenessDiff = Math.abs((cols / rows) - 1.0);
      const holePenalty = holes * 10;

      const penalty = orientationPenalty + (squarenessDiff * 20) + holePenalty;

      if (penalty < lowestPenalty) {
        lowestPenalty = penalty;
        bestCols = cols;
      }
    }
    return bestCols;
  }

  function syncColumnDropdown(itemCount, selectedCols) {
    if (!itemCount) return;

    gridCols.innerHTML = '';
    const maxOption = Math.max(5, itemCount);

    for (let c = 1; c <= maxOption; c++) {
      const opt = document.createElement('option');
      opt.value = String(c);
      opt.textContent = `${c} Column${c > 1 ? 's' : ''}`;
      if (c === selectedCols) opt.selected = true;
      gridCols.appendChild(opt);
    }

    updateUI();
  }

  function updateUI() {
    const isGrid = layoutType.value === 'grid';
    gridCols.disabled = !isGrid || !rawImages.length;
    gridColsGroup.classList.toggle('disabled', !isGrid || !rawImages.length);
  }

  // Shared handling for any newly-loaded set of Image elements, regardless of source
  function applyNewImageSet(newImages, { append = false } = {}) {
    if (!newImages.length) return;

    if (append && rawImages.length) {
      rawImages = rawImages.concat(newImages);
      transforms = transforms.concat(newImages.map(() => ({ scale: 1, rot: 0, x: 0, y: 0, panX: 0, panY: 0 })));
      photoMasks = photoMasks.concat(newImages.map(defaultPhotoMask));
      selectedIndices = [rawImages.length - newImages.length];
    } else {
      rawImages = newImages;
      transforms = rawImages.map(() => ({ scale: 1, rot: 0, x: 0, y: 0, panX: 0, panY: 0 }));
      photoMasks = rawImages.map(defaultPhotoMask);
      selectedIndices = [0];
    }

    activeCols = computeOptimalColumns(rawImages.length);

    syncColumnDropdown(rawImages.length, activeCols);
    extractSortedPalette(rawImages);

    paletteGroup.classList.remove('disabled');
    touchHint.style.display = 'block';
    photoControls.style.display = 'block';
    saveBtn.disabled = false;

    updateUI();
    syncSliderControls();
    requestRender();
  }

  // File Upload Handler
  imgInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    try {
      const images = await Promise.all(files.map(file => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load image file'));
          img.src = URL.createObjectURL(file);
        });
      }));
      applyNewImageSet(images, { append: false });
    } catch (err) {
      console.error('Error loading uploaded photos:', err);
    }
  });

  // --- Google Photos Import (via Google's official Photos Picker API) ---
  // Photos are fetched directly from Google by the browser using the user's
  // own OAuth token; nothing passes through any third-party server.
  const GPHOTOS_SCOPE = 'https://www.googleapis.com/auth/photospicker.mediaitems.readonly';
  let gphotosTokenClient = null;
  let gphotosAccessToken = null;

  function getGooglePhotosClientId() {
    let id = localStorage.getItem('gphotosClientId');
    if (!id) {
      id = prompt(
        'To import from Google Photos, paste your Google OAuth 2.0 Client ID.\n\n' +
        'You need to create your own free one in Google Cloud Console (enable the ' +
        '"Google Photos Picker API" and add this page\'s address as an Authorized ' +
        'JavaScript origin). See the README for step-by-step instructions.\n\n' +
        'It will be saved only on this device.'
      );
      if (id) {
        id = id.trim();
        localStorage.setItem('gphotosClientId', id);
      }
    }
    return id || null;
  }

  let gisLoadPromise = null;
  function ensureGoogleIdentityLoaded() {
    if (gisLoadPromise) return gisLoadPromise;
    gisLoadPromise = new Promise((resolve, reject) => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        resolve();
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Failed to load Google Sign-In. Check your internet connection.'));
      document.head.appendChild(script);
    });
    return gisLoadPromise;
  }
  // Start loading immediately (not inside the click handler) so it's
  // already available by the time the user clicks — see below for why.
  ensureGoogleIdentityLoaded().catch(() => {});

  // Deliberately NOT async: browsers only allow the popup opened inside
  // requestAccessToken() to succeed when it runs synchronously as a direct
  // response to the user's click, with no `await` in between (even a single
  // microtask tick is enough for Safari to treat the click as "used up").
  // Constructing `new Promise(executor)` still runs `executor` synchronously,
  // so as long as nothing above this awaits first, the popup call below
  // fires within the click's own call stack.
  function requestGooglePhotosAccessToken(clientId) {
    if (!(window.google && window.google.accounts && window.google.accounts.oauth2)) {
      return Promise.reject(new Error('Google Sign-In is still loading — please try again in a moment.'));
    }
    return new Promise((resolve, reject) => {
      if (!gphotosTokenClient || gphotosTokenClient.clientId !== clientId) {
        gphotosTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: GPHOTOS_SCOPE,
          callback: (resp) => {
            if (resp.error) { reject(new Error(resp.error)); return; }
            gphotosAccessToken = resp.access_token;
            resolve(resp.access_token);
          },
          error_callback: (err) => reject(new Error(err.type || 'Google sign-in was cancelled')),
        });
        gphotosTokenClient.clientId = clientId;
      }
      gphotosTokenClient.requestAccessToken({ prompt: gphotosAccessToken ? '' : 'consent' });
    });
  }

  function parseApiDuration(durationStr) {
    const match = /^(\d+(?:\.\d+)?)s$/.exec(durationStr || '');
    return match ? parseFloat(match[1]) * 1000 : null;
  }

  async function createPickerSession(accessToken) {
    const res = await fetch('https://photospicker.googleapis.com/v1/sessions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    if (!res.ok) throw new Error('Could not start a Google Photos picker session.');
    return res.json();
  }

  async function pollPickerSession(sessionId, accessToken, pollIntervalMs, timeoutMs) {
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
      const res = await fetch(`https://photospicker.googleapis.com/v1/sessions/${sessionId}`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      if (!res.ok) throw new Error('Lost connection to the Google Photos picker.');
      const session = await res.json();
      if (session.mediaItemsSet) return session;
      await new Promise(r => setTimeout(r, pollIntervalMs));
    }
    throw new Error('Timed out waiting for a photo selection in Google Photos.');
  }

  async function listPickedMediaItems(sessionId, accessToken) {
    const items = [];
    let pageToken = '';
    do {
      const url = new URL('https://photospicker.googleapis.com/v1/mediaItems');
      url.searchParams.set('sessionId', sessionId);
      url.searchParams.set('pageSize', '100');
      if (pageToken) url.searchParams.set('pageToken', pageToken);
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } });
      if (!res.ok) throw new Error('Could not list the photos picked in Google Photos.');
      const data = await res.json();
      items.push(...(data.mediaItems || []));
      pageToken = data.nextPageToken || '';
    } while (pageToken);
    return items;
  }

  function fetchPickedImage(item, accessToken) {
    return fetch(`${item.mediaFile.baseUrl}=d`, { headers: { 'Authorization': `Bearer ${accessToken}` } })
      .then(res => {
        if (!res.ok) throw new Error(`Could not download "${item.mediaFile.filename}" from Google Photos.`);
        return res.blob();
      })
      .then(blob => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Failed to decode "${item.mediaFile.filename}".`));
        img.src = URL.createObjectURL(blob);
      }));
  }

  // Kept between the two clicks below: the token/session obtained on the
  // first click, used once the user clicks through on the second.
  let pendingGPhotosSession = null;
  let pendingGPhotosAccessToken = null;

  // Click 1: sign in and start a picker session. No pop-up is opened here
  // by us — only Google's own sign-in library opens one (requestAccessToken
  // above), and only as the very next call after the click, so it's never
  // blocked. The actual Google Photos picker window is opened separately,
  // in direct response to a second click (see openGooglePhotosPickerTab),
  // since by the time the session exists we're several `await`s removed
  // from this click and a window.open() here would risk being blocked.
  async function importFromGooglePhotos() {
    const clientId = getGooglePhotosClientId();
    if (!clientId) return;

    gphotosImportBtn.disabled = true;

    try {
      gphotosImportBtn.textContent = 'Connecting…';
      const accessToken = await requestGooglePhotosAccessToken(clientId);

      gphotosImportBtn.textContent = 'Preparing picker…';
      const session = await createPickerSession(accessToken);

      pendingGPhotosSession = session;
      pendingGPhotosAccessToken = accessToken;

      gphotosImportBtn.style.display = 'none';
      gphotosOpenPickerBtn.style.display = '';
      gphotosOpenPickerBtn.disabled = false;
      gphotosOpenPickerBtn.textContent = '🔗 Tap to Open Google Photos';
    } catch (err) {
      console.error('Google Photos import failed:', err);
      alert(err.message || 'Could not import photos from Google Photos.');
      gphotosImportBtn.disabled = false;
      gphotosImportBtn.textContent = '📷 Google Photos';
    }
  }

  // Click 2: a fresh, direct user gesture, so window.open() here is safe
  // regardless of how long the async work in step 1 took.
  async function openGooglePhotosPickerTab() {
    const session = pendingGPhotosSession;
    const accessToken = pendingGPhotosAccessToken;
    if (!session) return;

    const pickerTab = window.open(session.pickerUri, '_blank');
    if (!pickerTab) {
      alert('Your browser blocked the Google Photos picker pop-up. Please allow pop-ups for this site and try again.');
      return;
    }

    gphotosOpenPickerBtn.disabled = true;
    gphotosOpenPickerBtn.textContent = 'Waiting for your selection…';

    try {
      const pollInterval = parseApiDuration(session.pollingConfig && session.pollingConfig.pollInterval) || 2000;
      const timeout = parseApiDuration(session.pollingConfig && session.pollingConfig.timeoutIn) || 5 * 60 * 1000;
      const finishedSession = await pollPickerSession(session.id, accessToken, pollInterval, timeout);

      const mediaItems = await listPickedMediaItems(finishedSession.id, accessToken);
      if (mediaItems.length) {
        const images = [];
        for (let i = 0; i < mediaItems.length; i++) {
          gphotosOpenPickerBtn.textContent = `Downloading ${i + 1}/${mediaItems.length}…`;
          images.push(await fetchPickedImage(mediaItems[i], accessToken));
        }

        fetch(`https://photospicker.googleapis.com/v1/sessions/${finishedSession.id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${accessToken}` }
        }).catch(() => {});

        applyNewImageSet(images, { append: true });
      }
    } catch (err) {
      console.error('Google Photos import failed:', err);
      alert(err.message || 'Could not import photos from Google Photos.');
    } finally {
      pendingGPhotosSession = null;
      pendingGPhotosAccessToken = null;
      gphotosOpenPickerBtn.style.display = 'none';
      gphotosImportBtn.style.display = '';
      gphotosImportBtn.disabled = false;
      gphotosImportBtn.textContent = '📷 Google Photos';
    }
  }

  layoutType.addEventListener('change', () => {
    updateUI();
    requestRender();
  });

  gridCols.addEventListener('change', (e) => {
    const val = parseInt(e.target.value, 10);
    if (!isNaN(val) && val > 0) {
      activeCols = val;
      requestRender();
    }
  });

  function toggleMultiSelectMode() {
    multiSelectMode = !multiSelectMode;
    multiSelectToggleBtn.classList.toggle('active', multiSelectMode);
    multiSelectHint.style.display = multiSelectMode ? 'block' : 'none';
  }

  function selectAllPhotos() {
    selectedIndices = rawImages.map((_, i) => i);
    syncSliderControls();
    requestRender();
  }

  function deselectAllPhotos() {
    selectedIndices = [];
    selectedPhotoLabel.textContent = "No Photos Selected";
    requestRender();
  }

  function syncSliderControls() {
    if (!selectedIndices.length) {
      selectedPhotoLabel.textContent = "No Photos Selected";
      return;
    }
    const primaryIdx = selectedIndices[0];
    const t = transforms[primaryIdx] || { scale: 1, rot: 0 };
    modScale.value = t.scale;
    modRotate.value = t.rot;
    scaleVal.textContent = parseFloat(t.scale).toFixed(2);
    rotVal.textContent = `${t.rot}°`;

    const m = photoMasks[primaryIdx] || defaultPhotoMask();
    maskMode.value = m.mode;
    maskBehavior.value = m.behavior;
    cornerRadius.value = m.radius;
    radiusVal.textContent = `${m.radius}px`;
    radiusGroup.classList.toggle('disabled', m.mode !== 'rounded');

    if (selectedIndices.length === 1) {
      selectedPhotoLabel.textContent = `Photo ${primaryIdx + 1} Selected`;
    } else {
      selectedPhotoLabel.textContent = `${selectedIndices.length} Photos Selected`;
    }
  }

  modScale.addEventListener('input', () => {
    const scale = parseFloat(modScale.value);
    scaleVal.textContent = scale.toFixed(2);
    selectedIndices.forEach(idx => {
      if (transforms[idx]) transforms[idx].scale = scale;
    });
    requestRender();
  });

  modRotate.addEventListener('input', () => {
    const rot = parseInt(modRotate.value, 10);
    rotVal.textContent = `${rot}°`;
    selectedIndices.forEach(idx => {
      if (transforms[idx]) transforms[idx].rot = rot;
    });
    requestRender();
  });

  function resetSelectedTransform() {
    selectedIndices.forEach(idx => {
      if (transforms[idx]) transforms[idx] = { scale: 1, rot: 0, x: 0, y: 0, panX: 0, panY: 0 };
    });
    syncSliderControls();
    requestRender();
  }

  // Mask controls apply to whichever photo(s) are currently selected, same
  // pattern as the scale/rotation sliders above.
  maskMode.addEventListener('change', () => {
    radiusGroup.classList.toggle('disabled', maskMode.value !== 'rounded');
    selectedIndices.forEach(idx => {
      if (photoMasks[idx]) photoMasks[idx].mode = maskMode.value;
    });
    requestRender();
  });

  maskBehavior.addEventListener('change', () => {
    selectedIndices.forEach(idx => {
      if (photoMasks[idx]) photoMasks[idx].behavior = maskBehavior.value;
    });
    requestRender();
  });

  cornerRadius.addEventListener('input', () => {
    const radius = parseInt(cornerRadius.value, 10) || 0;
    radiusVal.textContent = `${radius}px`;
    selectedIndices.forEach(idx => {
      if (photoMasks[idx]) photoMasks[idx].radius = radius;
    });
    requestRender();
  });

  // Fast Feedback Listeners
  [innerSpacing, outerSpacing].forEach(el => {
    el.addEventListener('input', () => {
      if (el === innerSpacing) innerSpacingVal.textContent = `${innerSpacing.value}px`;
      if (el === outerSpacing) outerSpacingVal.textContent = `${outerSpacing.value}px`;
      requestRender();
    });
    el.addEventListener('change', () => {
      requestRender();
    });
  });

  function requestRender() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(() => renderCollage(true));
  }

  function calculateImageDimensions(imgWidth, imgHeight, maxW, maxH, mode = 'fit') {
    if (!imgWidth || !imgHeight) return { w: maxW, h: maxH };
    const ratio = mode === 'cover' 
      ? Math.max(maxW / imgWidth, maxH / imgHeight)
      : Math.min(maxW / imgWidth, maxH / imgHeight);

    return {
      w: Math.round(imgWidth * ratio),
      h: Math.round(imgHeight * ratio)
    };
  }

  // Pure Aspect-Aware Render Engine.
  // `showEditingOverlays` draws the numbered badges and drag-selection
  // outline — on-screen editing aids only, left out of the saved/shared image.
  function renderCollage(showEditingOverlays) {
    if (!rawImages.length) return;

    const s = parseInt(innerSpacing.value, 10) || 0;
    const b = parseInt(outerSpacing.value, 10) || 0;
    const layout = layoutType.value;
    
    const cols = Math.max(1, activeCols || 1);
    const rows = Math.max(1, Math.ceil(rawImages.length / cols));
    
    const baseDimension = 600;

    cellBounds = [];

    // Pre-calculate natural cell dimensions for every layout type. Each
    // photo's own mask decides whether its cell is a fixed square (square/
    // circle masks) or fit to that photo's natural aspect ratio.
    const cellLayouts = rawImages.map((img, idx) => {
      const imgW = img.naturalWidth || img.width || 1;
      const imgH = img.naturalHeight || img.height || 1;
      const aspect = imgW / imgH;
      const photoMaskMode = (photoMasks[idx] || defaultPhotoMask()).mode;

      if (photoMaskMode === 'square' || photoMaskMode === 'circle') {
        return { w: baseDimension, h: baseDimension };
      }

      if (layout === 'horizontal') {
        return { w: Math.round(baseDimension * aspect), h: baseDimension };
      } else if (layout === 'vertical') {
        return { w: baseDimension, h: Math.round(baseDimension / aspect) };
      } else {
        return { w: baseDimension, h: baseDimension };
      }
    });

    let totalW = 0, totalH = 0;

    if (layout === 'grid') {
      totalW = (baseDimension * cols) + (s * (cols + 1));
      totalH = (baseDimension * rows) + (s * (rows + 1));
    } else if (layout === 'horizontal') {
      const sumWidths = cellLayouts.reduce((acc, cell) => acc + cell.w, 0);
      totalW = sumWidths + (s * (rawImages.length + 1));
      totalH = baseDimension + (s * 2);
    } else { // vertical
      const sumHeights = cellLayouts.reduce((acc, cell) => acc + cell.h, 0);
      totalW = baseDimension + (s * 2);
      totalH = sumHeights + (s * (rawImages.length + 1));
    }

    const collageW = totalW + (b * 2);
    const collageH = totalH + (b * 2);

    canvas.width = Math.max(1, collageW);
    canvas.height = Math.max(1, collageH);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Outer Frame Background
    if (b > 0 && outerColorVal !== 'none') {
      ctx.fillStyle = outerColorVal;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Inner Area Background
    if (innerColorVal !== 'none') {
      ctx.fillStyle = innerColorVal;
      ctx.fillRect(b, b, totalW, totalH);
    }

    // Position & Draw Image Cells
    let runningOffset = 0;

    rawImages.forEach((img, idx) => {
      const cellDim = cellLayouts[idx];
      let cellX = 0, cellY = 0;

      if (layout === 'grid') {
        const c = idx % cols;
        const rw = Math.floor(idx / cols);
        cellX = b + s + c * (baseDimension + s);
        cellY = b + s + rw * (baseDimension + s);
      } else if (layout === 'horizontal') {
        cellX = b + s + runningOffset;
        cellY = b + s;
        runningOffset += cellDim.w + s;
      } else { // vertical
        cellX = b + s;
        cellY = b + s + runningOffset;
        runningOffset += cellDim.h + s;
      }

      const cellW = cellDim.w;
      const cellH = cellDim.h;

      cellBounds.push({ idx, x: cellX, y: cellY, w: cellW, h: cellH });

      const t = transforms[idx] || { scale: 1, rot: 0, x: 0, y: 0, panX: 0, panY: 0 };
      const centerX = cellX + cellW / 2;
      const centerY = cellY + cellH / 2;

      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;

      const photoMask = photoMasks[idx] || defaultPhotoMask();

      // Use cover mode (aspect-fill) when square/circle mask is selected
      const fitMode = (photoMask.mode === 'square' || photoMask.mode === 'circle') ? 'cover' : 'fit';
      const fit = calculateImageDimensions(imgW, imgH, cellW, cellH, fitMode);

      // In cover mode the scaled image (fit.w/fit.h) is deliberately larger
      // than the cell in one axis, so it can be cropped down to size — the
      // mask/clip shape must be sized to the cell itself, not the oversized
      // image, or it doesn't actually crop anything. In fit mode fit.w/fit.h
      // already fit within the cell, so the mask hugs the image as before.
      const maskW = fitMode === 'cover' ? cellW : fit.w;
      const maskH = fitMode === 'cover' ? cellH : fit.h;

      ctx.save();

      // The mask/frame always sits at the unit's own position (x, y).
      // Panning (panX, panY) shifts only the photo content, expressed as a
      // true screen-space offset in both modes, so switching between Fixed
      // and Attached never jumps the crop you set up — only who moves in
      // response to dragging changes: Fixed updates panX/panY (content
      // slides inside a stationary frame), Attached updates x/y (the whole
      // framed photo moves together, keeping the same content-vs-frame
      // offset).
      const unitCenterX = centerX + t.x;
      const unitCenterY = centerY + t.y;

      if (photoMask.behavior === 'fixed') {
        // Frame stays unrotated at the unit position; content pans behind
        // it, then gets its own rotation/scale.
        applyMaskPath(ctx, photoMask.mode, unitCenterX - maskW / 2, unitCenterY - maskH / 2, maskW, maskH, photoMask.radius);
        ctx.clip();

        ctx.translate(unitCenterX + t.panX, unitCenterY + t.panY);
        ctx.rotate(t.rot * Math.PI / 180);
        ctx.scale(t.scale, t.scale);
        ctx.drawImage(img, -fit.w / 2, -fit.h / 2, fit.w, fit.h);
      } else {
        // Frame rotates with the unit but keeps a constant size (matching
        // Fixed mode's cell-based frame) regardless of zoom — only the
        // content is meant to grow when you zoom, not the frame itself.
        ctx.translate(unitCenterX, unitCenterY);
        ctx.rotate(t.rot * Math.PI / 180);

        applyMaskPath(ctx, photoMask.mode, -maskW / 2, -maskH / 2, maskW, maskH, photoMask.radius);
        ctx.clip();

        // The pan is re-expressed as a local offset that cancels out the
        // unit's own rotation/scale, so its on-screen effect matches
        // exactly what it looked like in Fixed mode.
        ctx.scale(t.scale, t.scale);
        ctx.save();
        const rad = -t.rot * Math.PI / 180;
        const localPanX = (t.panX * Math.cos(rad) - t.panY * Math.sin(rad)) / t.scale;
        const localPanY = (t.panX * Math.sin(rad) + t.panY * Math.cos(rad)) / t.scale;
        ctx.translate(localPanX, localPanY);
        ctx.drawImage(img, -fit.w / 2, -fit.h / 2, fit.w, fit.h);
        ctx.restore();
      }

      ctx.restore();

      if (showEditingOverlays) {
        // Blue Selection Box ONLY while dragging/moving
        if (isDragging && selectedIndices.includes(idx)) {
          ctx.save();
          ctx.strokeStyle = '#007aff';
          ctx.lineWidth = Math.max(4, Math.round(Math.min(cellW, cellH) * 0.015));
          ctx.strokeRect(cellX, cellY, cellW, cellH);
          ctx.restore();
        }

        // Number Badge
        ctx.save();
        ctx.beginPath();
        ctx.arc(cellX + 22, cellY + 22, 14, 0, 2 * Math.PI);
        ctx.fillStyle = selectedIndices.includes(idx) ? '#007aff' : 'rgba(0, 0, 0, 0.6)';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(idx + 1, cellX + 22, cellY + 22);
        ctx.restore();
      }
    });
  }

  function applyMaskPath(cCtx, type, x, y, w, h, radius) {
    cCtx.beginPath();
    if (type === 'square' || type === 'none') {
      cCtx.rect(x, y, w, h);
    } else if (type === 'circle') {
      const minDim = Math.min(w, h);
      cCtx.arc(x + w / 2, y + h / 2, minDim / 2, 0, 2 * Math.PI);
    } else if (type === 'ellipse') {
      cCtx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
    } else if (type === 'rounded') {
      cCtx.roundRect(x, y, w, h, Math.min(radius, Math.min(w, h) / 2));
    }
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleFactor = canvas.width / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleFactor,
      y: (clientY - rect.top) * scaleFactor
    };
  }

  function hitTestCell(x, y) {
    for (let i = cellBounds.length - 1; i >= 0; i--) {
      const b = cellBounds[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        return b.idx;
      }
    }
    return -1;
  }

  // Touch / Drag Handlers
  // Handles a tap/click on a photo cell. In multi-select mode this only
  // adds/removes the photo from the selection and returns true, so the
  // caller skips starting a drag on the same gesture. Otherwise it behaves
  // as before: replace the selection with the tapped photo.
  function handleCellTap(hit) {
    if (hit === -1) return false;
    if (multiSelectMode) {
      const pos = selectedIndices.indexOf(hit);
      if (pos === -1) selectedIndices.push(hit);
      else selectedIndices.splice(pos, 1);
      syncSliderControls();
      requestRender();
      return true;
    }
    selectedIndices = [hit];
    syncSliderControls();
    return false;
  }

  // Snapshot every selected photo's transform at drag start, so each can be
  // dragged relative to its own starting point (needed since a multi-select
  // drag can mix photos in Fixed vs Attached mode).
  function captureInitialTransforms() {
    initialTransforms = {};
    selectedIndices.forEach(idx => {
      if (transforms[idx]) initialTransforms[idx] = { ...transforms[idx] };
    });
  }

  // Applies a drag delta to every selected photo, updating panX/panY for
  // photos in Fixed mode (content slides behind a stationary frame) or x/y
  // for photos in Attached mode (the whole framed photo moves together).
  function applyDragDelta(dx, dy) {
    selectedIndices.forEach(idx => {
      const init = initialTransforms[idx];
      if (!init || !transforms[idx]) return;
      const behavior = (photoMasks[idx] || defaultPhotoMask()).behavior;
      if (behavior === 'attached') {
        transforms[idx].x = Math.round(init.x + dx);
        transforms[idx].y = Math.round(init.y + dy);
      } else {
        transforms[idx].panX = Math.round(init.panX + dx);
        transforms[idx].panY = Math.round(init.panY + dy);
      }
    });
  }

  canvas.addEventListener('touchstart', (e) => {
    // Without this, browsers fire a synthetic mousedown/click after a quick
    // tap (for legacy no-touch-listener compatibility), which would run our
    // mousedown handler a second time for the same tap — e.g. double-toggling
    // a multi-select pick right back off. preventDefault() suppresses that.
    e.preventDefault();
    if (e.touches.length === 1) {
      const coords = getCanvasCoords(e);
      const hit = hitTestCell(coords.x, coords.y);
      if (handleCellTap(hit)) return;
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      captureInitialTransforms();
      requestRender();
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const primaryIdx = selectedIndices[0];
      initialPinchScale = transforms[primaryIdx] ? transforms[primaryIdx].scale : 1;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1 && selectedIndices.length) {
      const rect = canvas.getBoundingClientRect();
      const scaleFactor = canvas.width / rect.width;
      const dx = (e.touches[0].clientX - dragStart.x) * scaleFactor;
      const dy = (e.touches[0].clientY - dragStart.y) * scaleFactor;
      applyDragDelta(dx, dy);
      requestRender();
    } else if (e.touches.length === 2 && initialPinchDist && selectedIndices.length) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const zoom = dist / initialPinchDist;
      const newScale = Math.min(3, Math.max(0.1, parseFloat((initialPinchScale * zoom).toFixed(2))));
      selectedIndices.forEach(idx => {
        if (transforms[idx]) transforms[idx].scale = newScale;
      });
      syncSliderControls();
      requestRender();
    }
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    initialPinchDist = null;
    requestRender();
  });

  // Mouse Handlers
  canvas.addEventListener('mousedown', (e) => {
    const coords = getCanvasCoords(e);
    const hit = hitTestCell(coords.x, coords.y);
    if (handleCellTap(hit)) return;
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    captureInitialTransforms();
    requestRender();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging || !selectedIndices.length) return;
    const rect = canvas.getBoundingClientRect();
    const scaleFactor = canvas.width / rect.width;
    const dx = (e.clientX - dragStart.x) * scaleFactor;
    const dy = (e.clientY - dragStart.y) * scaleFactor;
    applyDragDelta(dx, dy);
    requestRender();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    requestRender();
  });

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
      h = s = 0;
    } else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }

  function extractSortedPalette(canvases) {
    const noneBtn = paletteArea.querySelector('.swatch-none');
    paletteArea.innerHTML = '';
    paletteArea.appendChild(noneBtn);

    const rawColors = [];
    canvases.forEach(c => {
      const cCtx = document.createElement('canvas').getContext('2d');
      cCtx.drawImage(c, 0, 0, 5, 5);
      const data = cCtx.getImageData(0, 0, 5, 5).data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        const hsl = rgbToHsl(r, g, b);
        rawColors.push({ hex, r, g, b, ...hsl });
      }
    });

    const unique = [];
    rawColors.forEach(item => {
      if (!unique.some(u => Math.hypot(u.r - item.r, u.g - item.g, u.b - item.b) < 35)) {
        unique.push(item);
      }
    });

    unique.sort((a, b) => {
      if (Math.abs(a.h - b.h) > 15) return a.h - b.h;
      if (Math.abs(a.s - b.s) > 15) return b.s - a.s;
      return b.l - a.l;
    });

    unique.forEach(col => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = col.hex;
      swatch.onclick = () => {
        if (activeColorTarget === 'inner') {
          innerColorVal = col.hex; innerColor.value = col.hex;
        } else {
          outerColorVal = col.hex; outerColor.value = col.hex;
        }
        requestRender();
      };
      paletteArea.appendChild(swatch);
    });
  }

  // Native Share / Save
  saveBtn.addEventListener('click', () => {
    // Redraw without the on-screen editing badges/outline before capturing,
    // so the exported image is clean, then restore the normal editing view.
    renderCollage(false);
    canvas.toBlob(async (blob) => {
      const fileName = `grid-collage-${Date.now()}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Grid Collage' });
        } catch (err) {
          if (err.name !== 'AbortError') fallbackDownload(blob, fileName);
        }
      } else {
        fallbackDownload(blob, fileName);
      }
    }, 'image/png');
    requestRender();
  });

  function fallbackDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }

  updateUI();
</script>

</body>
</html>
