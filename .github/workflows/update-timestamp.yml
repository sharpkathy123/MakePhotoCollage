name: Update timestamp

# Stamps the current UTC time into the "Updated:" footer in index.html
# whenever main changes, so it always reflects what's actually live
# instead of a manually-edited (and easily forgotten) value.

"on":
  push:
    branches: [main]

jobs:
  stamp:
    # The commit this workflow makes below is itself a push to main, which
    # would otherwise re-trigger this workflow forever. Its commit message
    # is tagged "[skip ci]" so this guard breaks that loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp current timestamp into index.html
        run: |
          STAMP=$(date -u +"%Y-%m-%d %H:%M")
          sed -i "s|<span id=\"updateTimestamp\">.*</span>|<span id=\"updateTimestamp\">${STAMP}</span>|" index.html

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Timestamp unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update timestamp [skip ci]"
          git push
