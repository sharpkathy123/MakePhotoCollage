name: Update timestamp

# Stamps the current UTC time into the "Updated:" footer in index.html
# whenever main changes, so it always reflects what's actually live
# instead of a manually-edited (and easily forgotten) value. The page's
# own JS converts this to each viewer's local time on load; the UTC text
# stamped here is only the fallback shown before that runs (or with JS
# disabled).

"on":
  push:
    branches: [main]

jobs:
  stamp:
    # The commit this workflow makes below is itself a push to main, which
    # would otherwise re-trigger this workflow forever. Its commit message
    # is tagged "[skip ci]" so this guard breaks that loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp current timestamp into index.html
        run: |
          STAMP_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STAMP_TEXT=$(date -u +"%Y-%m-%d %H:%M")
          sed -i "s|<span id=\"updateTimestamp\"[^>]*>.*</span>|<span id=\"updateTimestamp\" data-updated-utc=\"${STAMP_ISO}\">${STAMP_TEXT} UTC</span>|" index.html

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Timestamp unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update timestamp [skip ci]"
          git push
